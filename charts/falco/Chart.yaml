apiVersion: v2
name: falco
version: 9.2.0
appVersion: "0.45.0"
description: Falco
keywords:
  - monitoring
  - security
  - alerting
  - metric
  - troubleshooting
  - run-time
home: https://falco.org
icon: https://raw.githubusercontent.com/cncf/artwork/master/projects/falco/horizontal/color/falco-horizontal-color.svg
sources:
  - https://github.com/falcosecurity/falco
dependencies:
  - name: falcosidekick
    version: "0.14.*"
    condition: falcosidekick.enabled
    repository: "file://../falcosidekick/"
  - name: k8s-metacollector
    version: 0.3.*
    repository: "file://../k8s-metacollector/"
    condition: collectors.kubernetes.enabled
  - name: falco-talon
    version: 0.5.*
    repository: "file://../falco-talon/"
    condition: responseActions.enabled
